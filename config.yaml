# Retest strategy — all tunable parameters live here, never in code.
# Judged by walk-forward OOS. Spec: strategy.md. Why: philosophy.md.

data:
  cache_dir: data/cache      # parquet cache, relative to project root
  tradingview:
    granularity: D           # D | W | M | H4 | H1 (5000 bars/pull: D->2007, H4->2023, H1->~7mo)
    exchange: OANDA          # default venue; per-pair overrides below
    symbols:                 # pair -> [tv_symbol, exchange]
      EUR_USD: [EURUSD, OANDA]
      GBP_USD: [GBPUSD, OANDA]
      USD_JPY: [USDJPY, OANDA]
      USD_CHF: [USDCHF, OANDA]
      AUD_USD: [AUDUSD, OANDA]
      USD_CAD: [USDCAD, OANDA]
      NZD_USD: [NZDUSD, OANDA]
      EUR_GBP: [EURGBP, OANDA]
      EUR_JPY: [EURJPY, OANDA]
      GBP_JPY: [GBPJPY, OANDA]
      EUR_CHF: [EURCHF, OANDA]
      USD_NOK: [USDNOK, OANDA]
      XAU_USD: [XAUUSD, OANDA]
      XAG_USD: [XAGUSD, OANDA]
      WTI_USD: [USOIL, TVC]
      BTC_USD: [BTCUSD, OANDA]
    universe:                # analyzed together as one portfolio
    - EUR_USD
    - GBP_USD
    - USD_JPY
    - USD_CHF
    - AUD_USD
    - USD_CAD
    - NZD_USD
    - XAU_USD
    - XAG_USD
    - WTI_USD
    - BTC_USD

atr:
  period: 14                 # Wilder ATR period, all timeframes

levels:
  swing_lookback: 4          # fractal swing window (bars each side)
  cluster_ticks: 5           # max tick distance between swings merged into one level
  tick_size: 0.0001          # price tick for the pair (clustering distance unit)
  min_swing_magnitude_atr: 0.3  # min swing size in ATR, else noise
  touch_tolerance_atr: 0.3   # close beyond this fraction of ATR = break (level dead)
  min_swings_per_level: 1    # obvious levels only: equal highs/lows
  extreme_lookback: 0        # bars for rolling day-extremes; level must sit at one; 0 = off
  extreme_proximity_atr: 0.25  # how close to the rolling extreme counts
  min_level_spacing_atr: 0.0 # drop weaker of two levels closer than this x ATR; 0 = off

retest:                        # breakout-then-return signal parameters
  max_break_return_bars: 24    # return must come within this many H1 bars after the break
  touch_gates:                 # pre-break touches -> required daily confirmations
    "3": 0
    "2": 0
    "1": 0
  pin_wick_body_ratio: 2.0     # pin wick must exceed body by this (daily bias pattern)
  bias_sfp_wick_atr: 0.1       # daily swing-failure sweep, in daily ATR
  bias_sfp_close_atr: 0.05     # daily swing-failure close back inside, in daily ATR
  fib_lookback: 20             # daily bars for the deep high/low fib legs
  fib_ratios: [0.382, 0.5, 0.618]
  fib_proximity_atr: 0.2       # level within this of a fib = confirmation
  special_fib_rule: true       # place limit at fib instead of raw level when close
  atr_stretch_period: 20       # daily SMA/ATR window for stretch confirmation
  atr_stretch_multiple: 1.0    # level this far from SMA20 = stretched
  stop_buffer_atr: 0.25        # stop beyond return-bar extreme, in ATR
  fta_fallback_atr: 2.0        # target when no opposing level exists
  min_reward_risk: 1.0         # skip if target < this x stop distance
  min_stop_atr: 0.7            # skip if stop distance < this x ATR (stops inside noise)
  limit_expiry_bars: 24        # H1 bars before an unfilled return limit expires
  max_level_age_days: 365      # drop levels whose latest swing is older than this
  ban_one_touch: false         # trade 2-3 touch setups only
  long_extra_confirmations: 0  # longs must clear required + 1
  atr_regime_lookback: 0       # H1 bars for ATR median; 0 = off
  atr_regime_mult: 1.0         # require cur ATR >= mult x median

session:
  enabled: true              # day-session only: no overnight holds
  entry_start_hour_utc: 0    # first entries allowed (UTC hour of return bar)
  entry_end_hour_utc: 20     # no new entries at/after this hour (exclusive)
  force_flat_hour_utc: 21    # flat illiquid 21-00 UTC window
  hold_winners_overnight: true  # winners run; losers cut; Friday flat all

backtest:
  spread_pips: 1.0
  slippage_pips: 0.5
  exit_slippage_pips: 1.0    # adverse fill on stop/target/warning exits
  pip_size: 0.0001           # default for 5-digit FX; per-pair overrides below
  pip_sizes:                 # price units of one pip per pair
    USD_JPY: 0.01
    XAU_USD: 0.1
    XAG_USD: 0.01
    WTI_USD: 0.01
    BTC_USD: 1.0
    SPX500_USD: 1.0         # 1 index point; spread/slippage in points
    NAS100_USD: 1.0
    US30_USD: 1.0
    DE30_EUR: 1.0
    UK100_GBP: 1.0
    JP225_USD: 1.0
  risk_per_trade_pct: 1.0    # fixed-fractional risk per trade; one position at a time
  min_equity: 10000          # starting equity
  max_hold_bars: 120         # timeout exit, bars after entry
  breakeven_at_r: 0.0        # move stop to entry at +1R; 0 = off

validation:
  walk_forward:
    in_sample_years: 0.75       # 9 months (sized to ~2y of hourly history)
    out_of_sample_years: 0.25   # 3 months rolling step
    min_trades: 20
  significance:
    confidence: 0.95
    deflated_trials: 50

portfolio:
  mode: skip               # skip | halve — same-group same-direction overlap rule
  max_usd_same_direction: 3  # 0 = off; cap concurrent USD-leg bets per side
  groups:                  # one shared bet each: pick best, never double
    - [AUD_USD, NZD_USD]   # risk-on commodity FX
    - [XAU_USD, XAG_USD]   # metals
    - [EUR_USD, GBP_USD, EUR_GBP, EUR_CHF]  # euro bloc
    - [USD_JPY, USD_CHF]   # safe-haven USD
    - [EUR_JPY, GBP_JPY]   # yen crosses

report:
  output_dir: reports
  figsize: [12, 6]
